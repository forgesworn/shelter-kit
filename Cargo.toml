[package]
name = "shelter-kit"
description = "Transport-neutral Blossom storage, retention and repair core"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ForgeSworn"]
repository = "https://github.com/forgesworn/shelter-kit"
readme = "README.md"
keywords = ["blossom", "nostr", "storage", "replication"]
categories = ["web-programming", "filesystem"]

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = "0.3.31"
fs2 = "0.4.3"
hex = "0.4.3"
http = "1.3.1"
nostr = { version = "0.45.3", features = ["os-rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream", "socks"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
# One TLS provider per process: reqwest is built provider-less and the fetch
# adapters install ring, so a node that also links ring via quinn/rustls (the
# ForgeSworn Link stack) carries exactly one backend.  Joint ledger finding 15.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
